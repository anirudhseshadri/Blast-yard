<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blast Yard</title>
<style>
  :root{
    --floor:#2b2f3a;
    --floor2:#333846;
    --steel:#8a93a6;
    --crate:#7d5a3c;
    --spark:#ffb347;
    --ink:#11131a;
    --paper:#e8e4d9;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    background:
      radial-gradient(120% 80% at 50% -10%, #3a4152 0%, #1a1d26 60%, #12141b 100%);
    color:var(--paper);
    font-family:"Rockwell","Bookman Old Style",Georgia,serif;
    display:flex;align-items:center;justify-content:center;
    padding:12px;
  }
  #wrap{width:100%;max-width:860px}
  #stage{position:relative;width:100%}
  canvas{
    width:100%;height:auto;display:block;
    image-rendering:auto;
    border-radius:6px;
    border:3px solid #10121a;
    box-shadow:0 18px 40px rgba(0,0,0,.55), inset 0 0 0 1px rgba(255,255,255,.06);
    background:#1b1e27;
  }
  .panel{
    position:absolute;inset:0;
    display:flex;align-items:center;justify-content:center;
    background:rgba(12,14,20,.86);
    border-radius:6px;
  }
  .card{
    width:min(520px,92%);
    background:#1f2330;
    border:2px solid #3c4356;
    border-radius:8px;
    padding:22px 24px;
  }
  h1{
    margin:0 0 2px;
    font-size:30px;letter-spacing:.5px;font-weight:700;
    color:#ffcf6b;
    text-shadow:0 2px 0 #7a4a12;
  }
  .sub{margin:0 0 18px;font-size:14px;color:#9aa3b8;font-family:system-ui,sans-serif}
  button{
    font:inherit;font-size:16px;
    background:#ffcf6b;color:#20160a;border:none;border-radius:5px;
    padding:11px 16px;cursor:pointer;
  }
  button.ghost{background:#2c3244;color:var(--paper);border:1px solid #454d63}
  button:disabled{opacity:.45;cursor:default}
  button:focus-visible{outline:3px solid #7fd1ff;outline-offset:2px}
  .row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}
  input{
    font:inherit;font-size:16px;text-transform:uppercase;letter-spacing:2px;
    background:#151822;color:var(--paper);border:1px solid #454d63;border-radius:5px;
    padding:10px 12px;width:150px;
  }
  .note{font-family:system-ui,sans-serif;font-size:13px;color:#9aa3b8;line-height:1.5}
  .code{
    font-family:ui-monospace,Menlo,Consolas,monospace;font-size:26px;letter-spacing:6px;
    color:#7fd1ff;background:#151822;border:1px dashed #3c4356;border-radius:5px;
    padding:8px 12px;display:inline-block;margin:4px 0 12px;
  }
  ul{margin:8px 0 0;padding-left:18px;font-family:system-ui,sans-serif;font-size:13px;color:#9aa3b8;line-height:1.6}
  .hide{display:none}

  /* lobby */
  input.name{text-transform:none;letter-spacing:0;width:170px}
  select{
    font:inherit;font-size:15px;
    background:#151822;color:var(--paper);border:1px solid #454d63;border-radius:5px;
    padding:10px 12px;
  }
  select:disabled{opacity:.75}
  .lbl{font-family:system-ui,sans-serif;font-size:13px;color:#9aa3b8;align-self:center}
  button.on{background:#6fcf82;color:#12200f}
  #playerList{list-style:none;padding:0;margin:12px 0 0}
  #playerList li{
    display:flex;align-items:center;gap:9px;
    padding:7px 9px;margin-bottom:5px;
    background:#191d28;border:1px solid #2f3648;border-radius:6px;
    font-family:system-ui,sans-serif;font-size:14px;color:var(--paper);
  }
  #playerList li.me{border-color:#5a647d;background:#1d2230}
  .dot{width:14px;height:14px;border-radius:50%;flex:0 0 auto;box-shadow:0 0 0 1px rgba(0,0,0,.45)}
  .pname{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tag{
    font-size:11px;letter-spacing:.4px;text-transform:uppercase;
    padding:2px 7px;border-radius:99px;border:1px solid #454d63;color:#9aa3b8;
  }
  .tag.ready{border-color:#3f7a4c;background:#1c2d20;color:#8ddb9d}
  .tag.wins{border-color:#7a6432;background:#2a2417;color:#ffcf6b}
  .waiting{font-family:system-ui,sans-serif;font-size:13px;color:#9aa3b8}

  /* connection news: waking the server, reconnecting, counting down */
  #netStatus{
    position:absolute;top:10px;left:50%;transform:translateX(-50%);
    background:#1f2330;border:1px solid #454d63;border-radius:99px;
    padding:6px 16px;font-family:system-ui,sans-serif;font-size:13px;
    color:#ffcf6b;white-space:nowrap;pointer-events:none;z-index:5;
  }

  /* touch controls */

  /* Holding a direction is a long press, and iOS answers a long press with the
     text selection callout: the magnifier, "Select All", "Copy". The
     unprefixed user-select is not what Safari listens to, so the -webkit-
     rules below are the ones doing the work. Nothing in the pad or the board
     is text you would ever want to select. */
  #pad, #pad *, canvas{
    -webkit-user-select:none;
    user-select:none;
    -webkit-touch-callout:none;
    -webkit-tap-highlight-color:transparent;
    touch-action:none;
  }
  /* kills the double-tap-to-zoom delay without taking pinch zoom away */
  body{touch-action:manipulation}

  #pad{display:none;margin-top:14px;justify-content:space-between;align-items:center;gap:16px}
  body.touch #pad{display:flex}

  /* a four way stick: your thumb goes anywhere on the base and the knob
     snaps to the gate you are asking for */
  #stick{
    position:relative;flex:0 0 auto;
    width:168px;height:168px;border-radius:50%;
    background:radial-gradient(circle at 50% 38%, #272c3a 0%, #1b1f29 70%);
    border:2px solid #3c4356;
    box-shadow:inset 0 2px 10px rgba(0,0,0,.5);
  }
  .sdir{
    position:absolute;background:#e8e4d9;opacity:.38;
    width:18px;height:14px;pointer-events:none;
  }
  .sdir.on{background:#ffcf6b;opacity:1}
  .sdir[data-k="u"]{top:13px;left:50%;margin-left:-9px;clip-path:polygon(50% 0,100% 100%,0 100%)}
  .sdir[data-k="d"]{bottom:13px;left:50%;margin-left:-9px;clip-path:polygon(50% 100%,0 0,100% 0)}
  .sdir[data-k="l"]{width:14px;height:18px;left:13px;top:50%;margin-top:-9px;clip-path:polygon(0 50%,100% 0,100% 100%)}
  .sdir[data-k="r"]{width:14px;height:18px;right:13px;top:50%;margin-top:-9px;clip-path:polygon(100% 50%,0 0,0 100%)}
  #knob{
    position:absolute;left:50%;top:50%;width:70px;height:70px;margin:-35px 0 0 -35px;
    border-radius:50%;background:#2c3244;border:2px solid #565f78;
    box-shadow:0 4px 12px rgba(0,0,0,.5), inset 0 2px 0 rgba(255,255,255,.07);
    transition:transform .06s ease-out;
    pointer-events:none;
  }
  #knob.on{background:#ffcf6b;border-color:#c2933a}
  #actions{display:flex;flex-direction:column;align-items:center;gap:10px}
  #kickBtn{
    width:104px;height:56px;border-radius:12px;
    background:#3f6f8c;border:2px solid #29506a;color:#eaf4fb;
    font-size:16px;font-family:inherit;display:flex;align-items:center;justify-content:center;
    touch-action:none;
  }
  #kickBtn.on{background:#7fd1ff;color:#0d2230}
  #kickBtn.hide{display:none}
  #bombBtn{
    width:104px;height:104px;border-radius:50%;
    background:#c2452f;border:2px solid #7d2a1c;color:#ffe8c9;
    font-size:17px;font-family:inherit;display:flex;align-items:center;justify-content:center;
    touch-action:none;
  }
  #bombBtn.on{background:#ffcf6b;color:#20160a}
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <canvas id="cv" width="600" height="560"></canvas>

    <div id="netStatus" class="hide"></div>

    <div class="panel" id="menu">
      <div class="card">
        <h1>Blast Yard</h1>
        <p class="sub">Drop bombs. Outlive everyone. The yard closes in when the clock runs out.</p>
        <div class="row">
          <button id="btnLocal">Play on one keyboard</button>
          <button id="btnHost" class="ghost">Create an online room</button>
        </div>
        <div class="row">
          <input id="joinCode" placeholder="CODE" maxlength="5">
          <button id="btnJoin" class="ghost">Join with code</button>
        </div>
        <p class="note" id="menuNote">Online games run on a shared server, so it does not matter whose tab stays open.</p>
      </div>
    </div>

    <div class="panel hide" id="lobby">
      <div class="card">
        <h1 id="lobbyTitle">Room open</h1>
        <p class="sub" id="lobbySub">Send this code to your cousins.</p>
        <div class="code" id="roomCode">-----</div>
        <div class="row">
          <input id="nameInput" class="name" placeholder="Your name" maxlength="12">
          <button id="btnReady" class="ghost">Ready</button>
        </div>
        <div class="row">
          <span class="lbl">Map</span>
          <select id="mapPick"></select>
        </div>
        <ul id="playerList"></ul>
        <div class="row" style="margin-top:12px">
          <button id="btnStart">Start match</button>
          <button id="btnCopy" class="ghost">Copy code</button>
          <button id="btnLeave" class="ghost">Leave</button>
        </div>
        <p class="waiting" id="lobbyNote"></p>
      </div>
    </div>
  </div>

  <div id="pad">
    <div id="stick">
      <span class="sdir" data-k="u"></span>
      <span class="sdir" data-k="l"></span>
      <span class="sdir" data-k="r"></span>
      <span class="sdir" data-k="d"></span>
      <div id="knob"></div>
    </div>
    <div id="actions">
      <div id="kickBtn" class="hide" data-k="k">Kick</div>
      <div id="bombBtn" data-k="b">Bomb</div>
    </div>
  </div>
</div>

<script type="module" src="src/main.js"></script>
</body>
</html>
